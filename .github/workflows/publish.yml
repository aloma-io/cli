name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  # The gate: nothing is published unless the same suite test.yml runs passes on the tagged commit.
  # Own permissions (the workflow-level id-token: write must not reach this job), no secrets.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # --ignore-scripts: the postinstall hook (aloma setup) is not needed to test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm@latest globally via tarball (bypasses self-replace MODULE_NOT_FOUND)
        run: |
          set -e
          NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/npm/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "Installing npm $NPM_VERSION via tarball"
          TARBALL_DIR=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar xz -C "$TARBALL_DIR"
          NPM_GLOBAL_PATH=$(node -p "require('path').resolve(process.execPath, '../../lib/node_modules')")
          echo "Replacing $NPM_GLOBAL_PATH/npm"
          rm -rf "$NPM_GLOBAL_PATH/npm"
          mv "$TARBALL_DIR/package" "$NPM_GLOBAL_PATH/npm"

      - name: Print npm version (diagnostic)
        run: npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Never publish with a known vulnerability in the locked dependencies.
      - name: Audit dependencies
        run: npm audit --audit-level=low

      # The release bot tags N+1 without writing it into package.json: the package version comes from the tag.
      # The tag reaches the script through the environment, never interpolated into it. Nothing is committed or pushed.
      - name: Set package version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $TAG_NAME is not three dot-separated numbers (optional leading v)" >&2
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if ! node -e 'const p = (s) => s.split(".").map(Number); const [t, c] = [p(process.argv[1]), p(process.argv[2])]; for (let i = 0; i < 3; i++) { if (t[i] !== c[i]) process.exit(t[i] > c[i] ? 0 : 1); }' "$VERSION" "$CURRENT"; then
            echo "Tag version $VERSION is lower than the package.json version $CURRENT" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --access public --provenance
