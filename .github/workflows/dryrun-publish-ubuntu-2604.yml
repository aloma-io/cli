# DRY RUN, do not merge (PLAT-140). Throwaway workflow for a draft PR that is closed unmerged.
# Repeats publish.yml on an explicit ubuntu-26.04 runner, then only dry-runs the publish.
# It cannot publish: no tag trigger, read-only contents permission, no OIDC token, no auth, no provenance.
name: DRY RUN publish on ubuntu-26.04

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm@latest globally via tarball (bypasses self-replace MODULE_NOT_FOUND)
        run: |
          set -e
          NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/npm/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "Installing npm $NPM_VERSION via tarball"
          TARBALL_DIR=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar xz -C "$TARBALL_DIR"
          NPM_GLOBAL_PATH=$(node -p "require('path').resolve(process.execPath, '../../lib/node_modules')")
          echo "Replacing $NPM_GLOBAL_PATH/npm"
          rm -rf "$NPM_GLOBAL_PATH/npm"
          mv "$TARBALL_DIR/package" "$NPM_GLOBAL_PATH/npm"

      - name: Print npm version (diagnostic)
        run: npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Never publish with a known vulnerability in the locked dependencies.
      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Publish (dry run only)
        run: npm publish --dry-run --access public

      - name: Pack (dry run only)
        run: npm pack --dry-run
