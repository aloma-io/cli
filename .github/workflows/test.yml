name: Test

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  # A new push to a PR replaces its older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on the newest Node; main and manual runs cover every supported
        # version (engines: >=18) before a release.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["18","20","22"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts: the postinstall hook (aloma setup) is not needed to test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails the job on any known vulnerability in the locked dependencies.
      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Test
        run: npm test
