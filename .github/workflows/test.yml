name: Test

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  # A new push to a PR replaces its older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on the recommended Node; main and manual runs cover every supported
        # version (engines: >=22) before a release.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["26"]') || fromJSON('["22","24","26"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts: the postinstall hook (aloma setup) is not needed to test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails the job on any known vulnerability in the locked dependencies.
      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Test
        run: npm test
